# ========================================================
# Perfil H2: Base de datos en memoria para pruebas rapidas
# ========================================================

# Base de datos H2 en memoria con compatibilidad MariaDB
spring.datasource.url=jdbc:h2:mem:DBTmp;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true

# Habilitar consola web de H2 en http://localhost:8085/api/v1/demoapirestdam235/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
