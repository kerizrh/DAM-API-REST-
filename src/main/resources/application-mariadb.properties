# ========================================================
# Perfil MariaDB: Conexión a MariaDB local en Windows
# ========================================================

# Conexion a MariaDB local (por defecto puerto 3307 segun my.ini o cambiar a 3306)
spring.datasource.url=jdbc:mariadb://localhost:3307/DBTmp
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracion de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
